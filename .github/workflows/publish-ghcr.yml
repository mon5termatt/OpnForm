name: Publish GHCR Images

on:
  push:
    branches: [license-bypass]
    paths:
      - "api/**"
      - "client/**"
      - "docker/**"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push API + Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image names (lowercase for GHCR)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE=${{ env.REGISTRY }}/${OWNER}/opnform-api" >> "$GITHUB_ENV"
          echo "UI_IMAGE=${{ env.REGISTRY }}/${OWNER}/opnform-client" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          build-args: |
            APP_ENV=production
            COMPOSER_FLAGS=--no-dev --optimize-autoloader --no-interaction
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ env.VERSION }}
            ${{ env.API_IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=opnform-api
          cache-to: type=gha,mode=max,scope=opnform-api

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.client
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.UI_IMAGE }}:latest
            ${{ env.UI_IMAGE }}:${{ env.VERSION }}
            ${{ env.UI_IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=opnform-client
          cache-to: type=gha,mode=max,scope=opnform-client
