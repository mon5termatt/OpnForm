name: Publish GHCR Images

on:
  push:
    branches: [license-bypass]
    paths:
      - "api/**"
      - "client/**"
      - "docker/**"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push API + Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags so APP_VERSION comes from the real release tag.
          fetch-depth: 0

      - name: Resolve version from upstream release tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE=${{ env.REGISTRY }}/${OWNER}/opnform-api" >> "$GITHUB_ENV"
          echo "UI_IMAGE=${{ env.REGISTRY }}/${OWNER}/opnform-client" >> "$GITHUB_ENV"
          # Docker tags can use the branch name; the in-app version should not.
          echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

          # Forks often lack upstream release tags — fetch them for describe.
          git remote add upstream https://github.com/OpnForm/OpnForm.git 2>/dev/null || git remote set-url upstream https://github.com/OpnForm/OpnForm.git
          git fetch --tags --force upstream

          # Avoid empty-pipeline success (sed exits 0 even when describe fails).
          BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -z "$BASE_VERSION" ]; then
            echo "No git tag found for APP_VERSION" >&2
            exit 1
          fi
          echo "Resolved APP_VERSION=${BASE_VERSION}"
          echo "APP_VERSION=${BASE_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          build-args: |
            APP_ENV=production
            COMPOSER_FLAGS=--no-dev --optimize-autoloader --no-interaction
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=opnform-api
          cache-to: type=gha,mode=max,scope=opnform-api

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.client
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            NUXT_PUBLIC_GITHUB_REPO_URL=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.UI_IMAGE }}:latest
            ${{ env.UI_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.UI_IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=opnform-client
          cache-to: type=gha,mode=max,scope=opnform-client
